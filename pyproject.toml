[project]
name = "fundamental-fine-tuning"
version = "0.1.0"
description = "Validated, leakage-aware chat dataset preparation for LLM fine-tuning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.9,<3",
  "transformers>=4.45,<5",
  "typer>=0.12,<1",
  "rich>=13.8,<14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
]

[project.scripts]
llm-data = "fundamental_fine_tuning.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundamental_fine_tuning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-ignore = ["TRY004"]

[tool.ruff.lint.per-file-ignores]
# typer's API requires function calls in parameter defaults.
"src/fundamental_fine_tuning/cli.py" = ["B008"]
